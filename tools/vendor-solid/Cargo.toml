# Bundles the pinned Solid 2 packages into host/fun/kit/vendor/solid.js
# (host/docs/frontend.md, "Solid 2 in tehas"). A person runs it when the pins
# change; it needs the network, so it is its own workspace and the gate never
# builds it.
[package]
name = "vendor-solid"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
flate2 = "1"
rolldown = "=1.3.2"
rolldown_common = "=1.3.2"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = "3"
