# The advisories this repository carries on purpose, read by the advisory step
# of .github/workflows/verify.yml. An entry names the id, why it is not fixed
# now, and the date to look again. After that date the ignore no longer applies
# and the gate fails on the advisory, so an ignore is a decision with a due
# date, not a way to stop hearing about it.
#
# An ignore is by advisory id, which covers that advisory and its aliases in
# every lockfile the step scans, not only the Rust ones: the reach of the
# decision is the whole scan, so its reason has to be true of all of it. An
# ignore whose advisory no longer applies is reported as unused and still
# passes, so it comes out when the dependency moves.
#
# The entry is left out here on purpose, to show the check fail.
