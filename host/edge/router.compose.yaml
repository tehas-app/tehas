# The edge router: the Protolab's pages and the previews of pull requests, on
# port 8081, picked by name (router.Caddyfile). Part of every install; it does
# not need the docs server, and it is started only where it is wanted.
#
# The container has no task but answering, reads its mounts and writes
# nothing: a read-only root, nothing of the host but those directories, and
# one capability, which the image's caddy binary is marked with and will not
# start without.
#
# It is on two networks. Its own carries the published port. tehas-previews is
# internal, and the host has no address on it: the previews are on it and on
# nothing else, so the router reaches them and they reach each other and
# nobody else, not the internet and not the host. That network is made outside
# this file, by install.sh and by `tehasbot preview`, because both sides need
# it whichever starts first.
#
# TEHAS_HOST_ADDR is the address it binds to, from the instance settings
# (source env.sh before running docker compose). Without it the server stays on
# the loopback address, reachable from the host only.
name: tehas-edge
services:
  router:
    image: caddy:2.8.4
    volumes:
      - "./router.Caddyfile:/etc/caddy/Caddyfile:ro"
      - "../protolab:/srv/protolab:ro"
      - "../fun:/srv/fun:ro"
    ports:
      - "${TEHAS_HOST_ADDR:-127.0.0.1}:8081:8081"
    networks:
      - default
      - previews
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
networks:
  previews:
    name: tehas-previews
    external: true
