# The Protolab server: the pages and files tehas-protolab writes to
# ../protolab, on port 8081. Part of every install; it does not need the docs
# server, and it is started only where the Protolab is wanted.
#
# The container has no network task but answering, reads its three mounts and
# writes nothing: a read-only root, nothing of the host but those directories,
# and one capability, which the image's caddy binary is marked with and will
# not start without.
#
# TEHAS_HOST_ADDR is the address it binds to, from the instance settings
# (source env.sh before running docker compose). Without it the server stays on
# the loopback address, reachable from the host only.
name: tehas-protolab
services:
  protolab:
    image: caddy:2.8.4
    volumes:
      - "./protolab.Caddyfile:/etc/caddy/Caddyfile:ro"
      - "../protolab:/srv/protolab:ro"
      - "../fun:/srv/fun:ro"
    ports:
      - "${TEHAS_HOST_ADDR:-127.0.0.1}:8081:8081"
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
