# The docs server: the operating manual, the dashboard and the health file on
# port 8080. Part of every install.
#
# TEHAS_HOST_ADDR is the address it binds to, from the instance settings
# (source env.sh before running docker compose). Without it the server stays on
# the loopback address, reachable from the host only. TEHAS_INDEXING=1 lets
# search engines index the pages; without it every page says noindex.
# TEHAS_ANALYTICS_SRC and TEHAS_ANALYTICS_SITE put a visitor analytics script
# in every page; without them there is none. TEHAS_THEME names the look of
# every page, fun/theme-<name>.css; without it the pages are pixel.
name: tehas-docs
services:
  docs:
    # caddy 2.8.4, named by digest so a moved tag cannot change what runs.
    # host/versions.env records the version and this digest together.
    image: caddy@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    environment:
      TEHAS_INDEXING: "${TEHAS_INDEXING:-0}"
      TEHAS_ANALYTICS_SRC: "${TEHAS_ANALYTICS_SRC:-}"
      TEHAS_ANALYTICS_SITE: "${TEHAS_ANALYTICS_SITE:-}"
      TEHAS_ANALYTICS_COOKIE: "${TEHAS_ANALYTICS_COOKIE:-0}"
      TEHAS_THEME: "${TEHAS_THEME:-pixel}"
    volumes:
      - "./docs.Caddyfile:/etc/caddy/Caddyfile:ro"
      - "../docs:/srv/docs:ro"
      - "../live:/srv/live:ro"
      - "../fun:/srv/fun:ro"
    ports:
      - "${TEHAS_HOST_ADDR:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    mem_limit: 128m
