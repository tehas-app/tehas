# The docs server: the operating manual, the dashboard and the health file on
# port 8080. Part of every install.
#
# TEHAS_HOST_ADDR is the address it binds to, from the instance settings
# (source env.sh before running docker compose). Without it the server stays on
# the loopback address, reachable from the host only. TEHAS_SITE_INDEXING=1 lets
# search engines index the pages; without it every page says noindex.
# TEHAS_SITE_ANALYTICS_SRC and TEHAS_SITE_ANALYTICS_NAME put a visitor analytics script
# in every page; without them there is none. TEHAS_DESIGN draws every page
# and picks the front page: beesknees26 (the business page) or pixel (the
# factory floor); without it beesknees26. TEHAS_SITE_CONSOLE=1 serves the
# running cycles' consoles under /live/; without it they are a 404.
#
# It answers from its mounts and writes nothing, so it is held as the router
# is: a read-only root, every capability dropped but the one the image's caddy
# binary is marked with, and no gain of rights.
name: tehas-docs
services:
  docs:
    # caddy 2.11.9, named by digest so a moved tag cannot change what runs.
    # host/versions.env records the version and this digest together.
    image: caddy@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    environment:
      TEHAS_SITE_INDEXING: "${TEHAS_SITE_INDEXING:-0}"
      TEHAS_SITE_ANALYTICS_SRC: "${TEHAS_SITE_ANALYTICS_SRC:-}"
      TEHAS_SITE_ANALYTICS_NAME: "${TEHAS_SITE_ANALYTICS_NAME:-}"
      TEHAS_SITE_ANALYTICS_COOKIE: "${TEHAS_SITE_ANALYTICS_COOKIE:-0}"
      TEHAS_DESIGN: "${TEHAS_DESIGN:-beesknees26}"
      TEHAS_SITE_CONSOLE: "${TEHAS_SITE_CONSOLE:-0}"
    volumes:
      - "./docs.Caddyfile:/etc/caddy/Caddyfile:ro"
      - "../docs:/srv/docs:ro"
      - "../live:/srv/live:ro"
      - "../fun:/srv/fun:ro"
    ports:
      - "${TEHAS_HOST_ADDR:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
