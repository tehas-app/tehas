<svg xmlns="http://www.w3.org/2000/svg" width="240" height="130" viewBox="0 0 240 130" shape-rendering="crispEdges">
<style>
  .bike-motion{animation:bike-travel 32s steps(34,end) infinite}
  .wheels{animation:add-wheels 32s steps(1,end) infinite}
  .controls{animation:add-controls 32s steps(1,end) infinite}
  .finishing{animation:add-finish 32s steps(1,end) infinite}
  .arm-one{animation:press-one 32s steps(3,end) infinite}
  .arm-two{animation:press-two 32s steps(3,end) infinite}
  .arm-three{animation:press-three 32s steps(3,end) infinite}
  .belt-markers{animation:belt-move 32s steps(3,end) infinite}
  @keyframes bike-travel{0%,25%{transform:translateX(-90px)}29%,32%{transform:translateX(15px)}35%,38%{transform:translateX(90px)}41%,47%{transform:translateX(145px)}50%,100%{transform:translateX(270px)}}
  @keyframes add-wheels{0%,30%{opacity:0}31%,100%{opacity:1}}
  @keyframes add-controls{0%,36%{opacity:0}37%,100%{opacity:1}}
  @keyframes add-finish{0%,42%{opacity:0}43%,100%{opacity:1}}
  @keyframes press-one{0%,28%,32%,100%{transform:translateY(0)}29%,31%{transform:translateY(22px)}}
  @keyframes press-two{0%,34%,38%,100%{transform:translateY(0)}35%,37%{transform:translateY(22px)}}
  @keyframes press-three{0%,40%,44%,100%{transform:translateY(0)}41%,43%{transform:translateY(22px)}}
  @keyframes belt-move{0%,25%,49%,100%{transform:translateX(0)}30%,36%,42%{transform:translateX(12px)}}
  @media(prefers-reduced-motion:reduce){.bike-motion,.wheels,.controls,.finishing,.arm-one,.arm-two,.arm-three,.belt-markers{animation:none}.bike-motion{transform:translateX(90px)}.wheels,.controls,.finishing{opacity:1}}
</style>
<rect width="240" height="130" fill="#ccd"/>
<rect y="98" width="240" height="32" fill="#8a5"/>
<rect x="0" y="18" width="240" height="8" fill="#333"/>
<g fill="#333"><rect x="47" y="24" width="7" height="26"/><rect x="122" y="24" width="7" height="26"/><rect x="167" y="24" width="7" height="26"/></g>
<g class="arm-one"><rect x="42" y="46" width="17" height="10" fill="#fc6"/><rect x="47" y="56" width="7" height="7" fill="#c53"/></g>
<g class="arm-two"><rect x="117" y="46" width="17" height="10" fill="#fc6"/><rect x="122" y="56" width="7" height="7" fill="#c53"/></g>
<g class="arm-three"><rect x="162" y="46" width="17" height="10" fill="#fc6"/><rect x="167" y="56" width="7" height="7" fill="#c53"/></g>
<rect x="0" y="98" width="240" height="18" fill="#333"/>
<rect x="0" y="101" width="240" height="10" fill="#7cb"/>
<g class="belt-markers" fill="#7cb"><path d="M-15 103h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9zm25 0h9v6h-9z"/></g>
<g class="bike-motion"><g transform="translate(0 40) scale(.58)">
  <g class="wheels"><g fill="#222"><rect x="10" y="72" width="26" height="5"/><rect x="10" y="95" width="26" height="5"/><rect x="6" y="77" width="5" height="18"/><rect x="35" y="77" width="5" height="18"/><rect x="83" y="72" width="26" height="5"/><rect x="83" y="95" width="26" height="5"/><rect x="79" y="77" width="5" height="18"/><rect x="108" y="77" width="5" height="18"/></g><rect x="20" y="82" width="7" height="7" fill="#fc6"/><rect x="93" y="82" width="7" height="7" fill="#fc6"/></g>
  <g class="frame" fill="#c53"><polygon points="23,85 48,54 55,57 31,88"/><polygon points="49,56 55,56 72,84 65,88"/><rect x="25" y="83" width="49" height="5"/><rect x="50" y="54" width="24" height="5"/><polygon points="74,56 80,55 96,85 89,88"/><rect x="70" y="83" width="26" height="5"/></g>
  <g class="controls" fill="#222"><rect x="49" y="45" width="5" height="12"/><rect x="41" y="43" width="23" height="5"/><polygon points="75,56 81,55 90,34 84,34"/><rect x="85" y="32" width="22" height="5"/></g>
  <g class="finishing"><rect x="4" y="66" width="39" height="6" fill="#222"/><rect x="1" y="72" width="6" height="14" fill="#222"/><rect x="40" y="72" width="6" height="14" fill="#222"/><rect x="8" y="68" width="31" height="4" fill="#fc6"/><rect x="5" y="74" width="4" height="8" fill="#fc6"/><rect x="38" y="74" width="4" height="8" fill="#fc6"/><rect x="56" y="81" width="14" height="9" fill="#fc6"/><rect x="60" y="84" width="6" height="3" fill="#222"/></g>
</g></g>
<rect y="117" width="240" height="13" fill="#7cb"/>
</svg>
