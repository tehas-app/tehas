<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .rotor{transform-origin:32px 27px;animation:turn 30s linear infinite}
    @keyframes turn{0%{transform:rotate(0deg)}66.667%{transform:rotate(720deg)}100%{transform:rotate(720deg)}}
    @media(prefers-reduced-motion:reduce){.rotor{animation:none}}
  </style>
  <!-- The rotor turns as the one in factory.svg does: two slow turns over
       twenty seconds, then ten seconds of stillness. A browser that does not
       animate a favicon shows it at rest, one blade up. -->
  <rect width="64" height="64" fill="#222"/>
  <path d="M28 28h8l3 34H25z" fill="#eec"/>
  <g class="rotor" fill="#fc6" stroke="#222" stroke-width="2">
    <path d="M32 27l-8-8 4-18h8l4 18z"/>
    <path d="M32 27l-8-8 4-18h8l4 18z" transform="rotate(120 32 27)"/>
    <path d="M32 27l-8-8 4-18h8l4 18z" transform="rotate(240 32 27)"/>
  </g>
  <circle cx="32" cy="27" r="6" fill="#7cb" stroke="#222" stroke-width="2"/>
</svg>
