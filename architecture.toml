# The architecture test's checks for tehas. The rules R1 to R10 and the
# grading are in docs/architecture-rubric.md; scripts/architecture.py is
# the same in every repository of the tehas system and reads this file.
#
# Each max is today's count, a ratchet: a pull request may not raise it,
# or change what a check counts, without a new `why`, and the pull request
# that lowers a count lowers its max. A max above 0 always says why. The
# aim for each is 0, or a floor written in docs/architecture.md. The
# questions a reviewer answers are in docs/architecture-review.md.
#
# Tests are counted, in files of their own and in #[cfg(test)] modules
# alike, so a test that moves does not lower a count it did not fix.
# Only a port's own fake and an adapter's own tests are allowed.

version = 1
method = "docs/architecture-rubric.md"
review = "docs/architecture-review.md"

[[check]]
id = "github-rest"
rule = "R1"
what = "GitHub's REST paths, its GraphQL API and its API host are written only in the forge"
pattern = 'api\.github\.com|\bgraphql\b|\brepos/(\{|\$|:owner)|"/?(user|users|orgs|installation)/|/(issues|pulls|labels|check-runs|commits|git/refs|releases|collaborators|installations|actions)(/|\b)\{|--jq\b|"--json"|\b(headRefName|baseRefName|headRefOid|mergedAt|closedAt|createdAt|updatedAt|isDraft|statusCheckRollup|reviewDecision|mergeStateStatus|mergeable|timelineItems|labelEvents|pageInfo|endCursor|hasNextPage)\b'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*", "host/fun/**/*.js"]
allowed = [
  # only Bounded and GhRunner, the runner the adapter takes from core until T4.11, and the reading of its reason; a GitHub call here must not hide behind this
  "console/core/src/forge.rs",
  # the GitHub adapter (T4.2), the one place GitHub's paths, gh and its statuses are written
  "console/github/**",
  # only the pi-rukas runner's --json flag given to tehascycle's caps check; a GitHub call here must not hide behind this
  "console/cycle/tests/headless_caps.rs",
  # only `tehas top --json` and the updatedAt key of tehas's own running.json; a GitHub call here must not hide behind this
  "console/tests/top_frame.rs",
  # only `tehas top --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/top_snapshot.rs",
  # only `tehas top --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/top_view.rs",
  # only `tehas drain --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/drain.rs",
  # only `tehas host-message list --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/host_message.rs",
  # only `tehas limit --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/limit.rs",
  # only `tehas export --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/export.rs",
  # only `tehas history --json`, tehas's own flag; a GitHub call here must not hide behind this
  "console/tests/history.rs",
]
comment = "//"
max = 741
why = "Re-measured at T0's follow-up, with tests in files counted and GitHub's JSON fields, --json and --jq added: the console 240, dispatch 225, ops 98, cycle 93, the front pages 69, mcp 38, store 37, core 21 outside the forge, analytics 8, xtask 6, the sandbox 4, the rest 1 or 2. 219 are in test files. Some field names (createdAt, updatedAt) are also tehas's own JSON keys where it copied GitHub's: T4 and T7 rename or own them. T4 moves the rest behind the three ports. T15's ports added 33 matches. Test files whose every match is tehas's own word are allowed: console/cycle/tests/headless_caps.rs (the pi-rukas runner's --json flag given to tehascycle's caps check), console/tests/top_snapshot.rs and console/tests/top_view.rs (tehas top's --json), console/tests/top_frame.rs (tehas top's --json and the updatedAt key of tehas's own running.json). Still counted from those ports: the updatedAt and closedAt of the items of live/status.json in console/tests/top/mod.rs, GitHub's names that the queue copies through unchanged, which T4/T7 rename or own; and the --json of tehas order in console/tests/console_run.rs, in a file with gh stubs; both are findings in T4's Done in the plan. Below its fork value (846) by 27. Each allowed test file is listed in `allowed` with a comment saying what it covers. T16's drop of the millwright's grant takes out 6, the drop of All hands 3. T16's drop of the Spec mark takes out 2. T4.2 moves the forge's GitHub side into the adapter, console/github/ (tehas-github), and the allowed with it: console/github/** in place of console/core/src/forge/**. console/core/src/forge.rs stays allowed while Bounded and GhRunner are in it, until T4.11. The count is unchanged. T4.10 moves `tehas stop`'s running mark onto the tickets port: its gh read with --json and --jq goes: 2 fewer. T8 froze the bash this check reads as a written floor of 4 in docs/architecture.md, \"The bash that stays\" (the owner, 2026-11-23): all in host/sandbox/gh-shim, the sandbox's security shim, lines 43, 50 and 57, which decide whether a gh api graphql call writes, and the comment at line 33, which counts because this check's comment prefix is // and not #. T4.5's finish lists its open changes, opens its draft and takes its remote through the code host port, so its GraphQL question, its gh pr create and its hand-built https remote go, and its tests run on the ports' fake: 13 fewer. T4.5 (b): the park's question, its comment and its last attempt go through the ports, and the cycle's end-to-end tests assert the park's writes on the ports' fake: 5 fewer. T15's ports of the drain, host-message and limit shell tests (#2817) allow their three Rust test files, whose every match is tehas's own --json: the count is unchanged. T4.6 (D1) names the queue page's timeline and creation fields once in dispatch's read/github.rs, for its parse and for read/board.rs, the mapping of the board port's answer into the page's shapes: 3 fewer. T4.6 (D2): five of read/build.rs's tests build the queue's page from a world of the ports' fake through read/board.rs, not hand-written GraphQL nodes: 13 fewer. T4.6 (D3): the pull-request tests of read/build.rs take their open and closing pull requests from the ports' fake's changes through read/board.rs; GitHub's own shapes stay hand-written until the page parse goes: 1 fewer. T15's ports of the export and history shell tests (#2821) allow their two Rust test files, console/tests/export.rs and console/tests/history.rs, whose every match is tehas's own --json: the count is unchanged. T4.11's mcp links an issue and its pull request through the code host's Cites::link, so sessions.rs builds no GitHub address: 1 fewer. T4.11's plugin reads a hook's pull request through CodeHost::change and posts its status through CodeHostWrites::set_status, so status.rs builds no REST path: 1 fewer. T4.10: `tehas plugin hook` reads its pull request with `Board::open_changes` for its one number through the console's wiring, not with gh's `repos/.../pulls` path, and its test runs on the ports' fake: 2 fewer."

[[check]]
id = "gh-argv"
rule = "R2"
what = "the gh program is run only by the forge"
pattern = '"gh"|\bgh (api|pr|issue|repo|release|run|label|auth|search|workflow|secret|variable)\b'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*"]
allowed = [
  # only Bounded and GhRunner, the runner the adapter takes from core until T4.11, and the reading of its reason; a GitHub call here must not hide behind this
  "console/core/src/forge.rs",
  # the GitHub adapter (T4.2), the one place GitHub's paths, gh and its statuses are written
  "console/github/**",
  # only DENIED and UNREACHED, the list of tools every test stubs to fail; nothing runs them. A gh call here must not hide behind this
  "console/core/src/testing.rs",
]
comment = "//"
max = 297
why = "Re-measured at T0's follow-up, with tests in files counted: dispatch 207, cycle 67, the console 62, ops 34, core 13, store 11, mcp and xtask 4 each, the rest 1 or 2. 255 are in test files, which T1 moves onto the ports' fakes. The security shims that decide whether a gh call writes are among the rest: whether they stay separate is the owner's (T4), and those that stay become a written floor. console/core/src/testing.rs is allowed: it owns DENIED and UNREACHED, the lists of tools every test stubs to fail; nothing runs them. Eight harnesses had their own copy of the deny list and three tests their own list of tools stubbed to fail; they use the two lists now, which takes out 10 (5 of them from T15's ports, 5 older), and console_run reads the calls of each tool in UNREACHED in place of calls(\"gh\"). Still counted from T15's ports: the short name \"gh\" of a process in a fixture of /proc in console/tests/top_snapshot.rs, a false positive kept as a written floor of 1 in docs/architecture.md, because a pattern that skipped it would be fragile. Below its fork value (408) by 22. Each allowed test file is listed in `allowed` with a comment saying what it covers. T16's drop of the Spec mark takes out 2. T4.2 moves the forge's GitHub side into the adapter, console/github/ (tehas-github), and the allowed with it: console/github/** in place of console/core/src/forge/**. console/core/src/forge.rs stays allowed while Bounded and GhRunner are in it, until T4.11. The count is unchanged. T4.10 moves `tehas stop`'s running mark onto the tickets port: its two \"gh\" calls go, and the console's wiring asks with the \"gh\" tehas resume already names: 2 fewer. T8 froze the bash this check reads as a written floor of 3 in docs/architecture.md, \"The bash that stays\" (the owner, 2026-11-23): lib/github-app.sh line 19, the credential helper git is given, which names the console's shim; and two comments, host/sandbox/gh-shim line 33 and scripts/tag-release.sh line 68, which count because this check's comment prefix is // and not #. No bash here runs gh by that pattern. T4.5 moves the relay of a cycle onto the blueprints port: its write goes through BlueprintWrites, so it builds no gh argument list of its own: 1 fewer. T4.5 (a): the cycle report's marks, comments, pull request comment and refreshing mark build no gh argument lists, and the cycle's end-to-end tests assert the report's writes on the ports' fake: 21 fewer. T4.5 (b): the park's writes build no gh argument lists, and the cycle tests assert them on the ports' fake: 6 fewer. T4.7 2a sends the dispatcher's comments through the tickets port, and its tests assert them as typed writes: 33 fewer. T4.7 2b sends the poll's label changes through the tickets port: 3 fewer."

[[check]]
id = "label-words"
rule = "R1"
what = "the state labels and markers (tehas:...) are written only in the one module that names them"
pattern = 'tehas:[a-z]|\bneeds-human-attention\b|"epic"'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*", "host/fun/**/*.js"]
allowed = [
  # the GitHub adapter's table of labels, checked against host/labels.tsv (T4.2)
  "console/github/src/table.rs",
  # the GitHub adapter's own tests, on its recordings (T4.2)
  "console/github/tests/**",
  # only the park marker given to the store lint as a line its patterns must not take; a label written here must not hide behind this
  "console/tests/store_paths.rs",
]
comment = "//"
max = 1554
why = "Re-measured at T0's follow-up, with tests in files counted and needs-human-attention and epic added: dispatch 1010, cycle 228, core 189, the console 184, ops 137, store 70, the front pages 34, mcp 21, analytics 4, plugin 1. 930 are in test files. T2 gives the state words one owner in core, checked against host/labels.tsv. console/tests/store_paths.rs is allowed: its one match is a park marker it gives the store lint's patterns as a line they must not take, data the lint reads, not a label anything writes. Each allowed test file is listed in `allowed` with a comment saying what it covers. T16's drop of the millwright's grant takes out 30, the drop of All hands 15. The drop of tehas:prototype takes 17 out. T16's drop of the Spec mark takes out 33. T4.2 allows the GitHub adapter's table, console/github/src/table.rs, checked against host/labels.tsv, and the adapter's tests, console/github/tests/**: the forge's one label word moves into the table and its tests' 22 into the adapter's tests, which takes out 23. T4.3 moves the forge's callers onto the tickets port: `tehas dev` and `tehas plan` name the acts Approve, Plan and Refine for console/src/label.rs, `tehas labels` no longer parses the table at run time and its table tests go to the adapter's, and the test of `tehas resume`'s read moves from console/tests/resume_switch.rs onto the fake in console/ops/tests/resume_switch.rs, whose expected lines keep the label's name: 12 fewer. T4.10 moves `tehas stop`'s running mark onto the tickets port: the mark is read and taken off as Mark::State(State::Running); its four lines keep the label's name until a mark can be cited, and its tests on the fake name it once: 1 fewer. The label pins tests write the ready label through its constant: 2 fewer. T4.5 (a): the cycle report's relabels hold Marks, and the cycle's end-to-end tests assert the report's writes in marks on the ports' fake, not label names in gh's arguments: 106 fewer. tests/fixtures.rs keeps a map of the four states its recorded bash cases name. T4.5 (b): the cycle's end-to-end tests assert the park's writes in marks on the ports' fake, not label names in gh's arguments: 18 fewer. T4.6 (D2): five of read/build.rs's tests build their worlds in marks on the ports' fake, spelt by host/labels.tsv through read/board.rs's test support: 16 fewer. T4.7 2b asserts the poll's label changes as typed marks: 18 fewer."

[[check]]
id = "home-layout"
rule = "R1"
what = "the $TEHAS_HOME layout (state/, live/, run/) is written only in Home"
pattern = '"(state|live|run)/|join\("(state|live|run)"\)|TEHAS_HOME}?/(state|live|run)\b|~/tehas/(state|live|run)\b|\{home\}/(state|live|run)\b|%h/tehas/(state|live|run)\b|/tehas/(state|live|run)/'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*", "host/fun/**/*.js"]
allowed = [
  "console/core/src/home.rs",
  # only the store lint's patterns and the sample shell lines given to them; a path into the home written here must not hide behind this
  "console/tests/store_paths.rs",
]
comment = "//"
max = 319
why = "T5 gives the layout one owner, Home (console/core/src/home.rs), which writes it and is allowed. The count is what is still written elsewhere, measured at the last step of dispatch's slice: dispatch 301, cycle 71, store 16, ops 14, the console 10, install.sh 21, core 5, the units 5, xtask 1. T5 has moved every crate onto Home, dispatch in three steps: what the poll reads of the host (read/) asks Home, which takes out 14, and 5 literals come in with the tests that pin the paths no test read by a literal (a cycle's cid, the sweep's three, the two notes of the last poll); what the poll writes (apply/) asks Home too, which takes out 24; the poll's own files, the refresh's directory and the pause flag's warning ask Home, which takes out 10, and 3 literals come in with the tests that pin the stuck file and the report's path. Of dispatch's 301, 2 are source: the poll's check for an older tehas's records names state/cycles in its message as it lists it. The other 299 are its tests, which keep their literals so Home is not checked against itself. Floors: the bash and the units, which T8 froze as a written floor in docs/architecture.md, \"The bash that stays\" (the owner, 2026-11-23): install.sh 12 and the units 4, 16 in all, which may only fall; the shell stubs in the tests of cycle (65 of its 71 then, 64 of its 70 at T8, the runner's notes under state/cycles) and of the console (5 of its 10 then, 5 of its 9 at T8, in its update tests: console/tests/update.rs 2, update/mod.rs 2, update_checkout.rs 1), which are Rust test files and no part of T8's floor, and are T5's, whose Done is home-layout at 0 outside Home; the tests whose expected value is a path, an argument or a message naming one (3 more of cycle, 4 more of the console, the expected path at console/src/wake.rs line 89 among them, 9 of the store, 9 of ops), which keep the literal so Home is not checked against itself; a file nothing writes any more, which cycle's tests check is not made (its last 3); a test's own scratch file (the console's last 1 then, gone at T8; one of the store), whose name is not one Home gives; the store's messages that name state/cycles (its other 6); xtask's run dir and the scratch dir of ops' update sandbox test (its other 5), which are not the home; and in core, the tests that pin a path's literal against Home and a container's own state dir. console/tests/store_paths.rs is allowed: each of its matches is a pattern of the store lint or a sample line given to the patterns, shell text naming the old files under $TEHAS_HOME/state so each pattern is shown to find it, data the lint reads and not a path anything writes. Each allowed test file is listed in `allowed` with a comment saying what it covers. T16's drop of the Spec mark takes out 1. install.sh names each path under state/ that more than one of its lines wrote once, in a variable set after the home is settled: the state directory (5 lines to 1), the store's file state/tehas.db (5 to 1), state/backup (2 to 1) and state/dispatch.lock (2 to 1). The line that makes the home's directories still counts for live/. That takes out 9: install.sh 21 to 12. T8 corrects the units: 4, not the 5 measured above, three paths systemd is given (tehas-dispatch.path, tehas-dispatch.service, tehas-mcp-fetch.socket) and one comment (tehas-cycle@.service line 9). Of install.sh's 12, 2 are comments (lines 97 and 140). The 3 comments count because this check's comment prefix is // and not #. T5's last steps take the literals out of the tests too, so a path's literal is written once, in Home, and each test asks Home for the path it expects. The store, core, ops, the console and xtask go first, 434 to 389: the store's messages name state/cycles through home::CYCLES; the tests ask Home for an expected path, the unit test of the bot's login and the update tests' shell among them; a test's own scratch directory (the seed's, the sandbox hash's, xtask's run records) takes a name that is not the home's. Cycle's tests follow, 389 to 319: its test harnesses give the runner's stubs $T_CYCLES, the cycles directory Home gives, so no shell snippet writes state/cycles; the mount and the poll's ask are expected as Home's token dir and DispatchAgain give them. What is left at 319: dispatch 300, ops 3 (the token dirs' test in ops/src/github.rs, left while another change holds that file), and T8's floor, install.sh 12 and the units 4."

[[check]]
id = "untyped-signatures"
rule = "R4"
what = "no serde_json::Value in a function's signature"
mode = "spans"
start = '^\s*(pub(\([^)]*\))?\s+)?(const\s+)?(async\s+)?(unsafe\s+)?fn\s'
end = '\{|;\s*$'
pattern = '\bValue\b'
files = ["console/**/*.rs"]
allowed = [
  # a test-only serde format: `Value` is serde's Visitor associated type, never serde_json::Value; an untyped seam here must not hide behind this
  "console/ports/tests/tree/mod.rs",
]
comment = "//"
max = 1134
why = "console/ports/tests/tree/mod.rs is allowed (T4.1): its 11 matches are serde's associated type Value of a Visitor or a DeserializeSeed, which every deserializer names in its signatures, in the small format the ports' tests round-trip their types through, since tehas-ports takes serde alone and no serde_json. None is serde_json::Value, and an untyped seam may never be allowed here on that ground. Re-measured at T0's follow-up, with tests in files counted: dispatch 366, mcp 251, cycle 181, the console 162, core 128, ops 89, store 77, analytics 45, attach 42, plugin 33. 377 are in test files. T3 types the dispatcher's core, T4 the ports, T5 the store client; T7 moves the rest or writes a floor for an adapter's own parsing. T15's port of test/preview_choose_test.sh adds 1, the test helper in console/src/preview/choose_tests.rs that edits a row of GitHub's list as the shell's jq did: the row is the untyped value preview::choose itself takes, so it is no new untyped interface and goes when T7 types that list. T16's drop of the millwright's grant takes out 12. T16's drop of the Spec mark takes out 10. T7 types what wiki-collect returns (Commit, Tag, Changed) and the build.json wiki-render reads (Build): 4 fewer. T7 reads the arguments of a tools/call where the request comes in, into the tool's own type (mcp's tools::Call and tickets::Call), and refuses them there in the tool's words: 8 fewer, the two readers of Args and tickets::run counted; Args, which holds the request's JSON, is what those readers take. T7 reads an item's .meta.json into items' Meta (Ticket, File, Skipped) and the unpack answer into its entries: 9 fewer. T7 types what attach's unpack returns (Unpacked, which serialises to the answer's entries): 5 fewer. T4.5's finish reads its open changes as ChangeDigests, not GitHub's JSON: own_pulls, pull_named and pull_for_issue go: 5 fewer. T4.5 (b): the park's writes go through the ports, and the cycle tests read them on the fake: 1 fewer. T7 types the analytics report (Report and its sections, which text renders) and reads the ledger lines beside the database into their own types: 21 fewer. T7 types the seams of the small crates: describe reads a manifest's images as entries of words, review-render takes the run's document as its own Document, and wiki-render writes build.json from a Record: 7 fewer. T7 types the files core writes and reads of its own: a plugin's state.json, a hook's request and its verdict file, a run's context.json, the end-failed record and the read of starts.json (Edge serialises itself): 11 fewer. Record::to_value, Reason::to_value and the holds, pause, limit and order readings stay until the dispatcher, which takes them as values, is typed. T7 (cycle) reads the runner's result, the lines of its stream, the progress summary, the caps answer and the driver's work state into types where they are read (tehas_cycle::loose keeps jq's rule for a field of another type), and runner::values and first_value read into the caller's type: 47 fewer. T7 types what tehas disk answers (disk::Answer, its file systems, places, Docker's figures and the cycles' figures): 12 fewer. Of the count, 147 are T7's written floor in docs/architecture.md, \"Typed seams that stay untyped (T7)\": JSON Schemas and their checkers 91, bodies passed through whole 26, pi's models.json 16, contract tests that walk any answer 14. T4.10: `tehas plugin hook`'s test gives its pull request on the ports' fake, not as GitHub's JSON: 1 fewer."

[[check]]
id = "untyped-fields"
rule = "R4"
what = "no serde_json::Value in a public field, an enum variant or a tuple field"
pattern = '^\s*pub(\([^)]*\))?\s+[a-z_][a-z0-9_]*\s*:.*\bValue\b|^\s*[A-Z][A-Za-z0-9]*\s*\([^()]*\bValue\b[^()]*\),?\s*$|^\s*(pub(\([^)]*\))?\s+)?struct\s+\w+\s*(<[^>]*>)?\s*\(.*\bValue\b'
files = ["console/**/*.rs"]
comment = "//"
max = 23
why = "Re-measured at T0's follow-up, with enum variants and tuple fields added: dispatch 23 (Snapshot and its rows, after T3 typed the closing pull requests, the pause flag, the limit, the start order, the host's approvals, the branch check, the push fault, the lists of issues and pull requests and the parks owed a retry or a refine), cycle 7, ops 5, attach, core and the console 3 each, mcp, plugin and store 1 each. T3 types Snapshot; T7 the rest, or a written floor. T16's drop of the Spec mark takes out 1. T7 types the entries of items' unpack answer: 1 fewer. T7 types what attach's unpack writes of an entry: 1 fewer. T7 (cycle): Facts::work_state holds the WorkState the note reads, and the watch's Seen the runner's Outcome: 2 fewer. T7 types the figures of the cycles tehas disk reads (CycleRead's writable and written): 2 fewer. Of the count, 2 are T7's written floor in docs/architecture.md: a plugin tool's params schema (manifest.rs) and pi's models.json (models.rs). T4.11's run tests hold the code host as the ports' fake, not as gh's JSON of a pull request: 1 fewer."

[[report]]
id = "public-items"
rule = "R5"
what = "public items per file, pub(crate) and pub use included: a rise is a question in review"
pattern = '^\s*pub(\([^)]*\))?\s+((async|const|unsafe)\s+)*(fn|struct|enum|trait|type|const|static|mod|use)\b'
files = ["console/**/*.rs"]
allowed = ["console/**/tests/**", "console/**/tests.rs", "console/**/*_tests.rs"]
comment = "//"
top = 20

# R3, R8: the core. Today it is the dispatcher's decide and the modules it
# reads: what it decides from (snapshot, settings, place, text, questions,
# starts). tehas-core
# is not pure (it holds the forge, the sandbox and the process runner), so
# it is not the core; T6 settles where the core ends and widens these.

[[check]]
id = "core-effects"
rule = "R3"
what = "the core reads no file, network, process, environment or clock"
pattern = 'std::(fs|net|process|env)\b|\bfs::|Command::new|SystemTime::now|Instant::now|Utc::now|Local::now|env::var|reqwest|tokio::(fs|net|process)|thread::sleep'
files = ["console/dispatch/src/decide.rs", "console/dispatch/src/decide/**", "console/dispatch/src/place.rs", "console/dispatch/src/snapshot.rs", "console/dispatch/src/text.rs", "console/dispatch/src/settings.rs", "console/dispatch/src/questions.rs", "console/dispatch/src/starts.rs", "console/dispatch/src/answer.rs"]
comment = "//"
max = 0
why = "The core's files, and since T12.1 the reading of an answer of tehas answer (dispatch/src/answer.rs), which decide and the snapshot use: it reads nothing either."

[[check]]
id = "core-inward"
rule = "R8"
what = "the core uses nothing of the shell or the adapters"
pattern = '\b(crate::(read|apply|poll|finish|auto_finish|refresh|pins|usage)|tehas_core::(forge|sandbox|call|retry|access|journal|lock|file|disk|install|tunnel|github_fails|release|rukas))\b'
files = ["console/dispatch/src/decide.rs", "console/dispatch/src/decide/**", "console/dispatch/src/place.rs", "console/dispatch/src/snapshot.rs", "console/dispatch/src/text.rs", "console/dispatch/src/settings.rs", "console/dispatch/src/questions.rs", "console/dispatch/src/starts.rs", "console/dispatch/src/answer.rs"]
comment = "//"
max = 1
why = "The map at T0 had three; T3 moved the push fault's hold into snapshot.rs. decide.rs reads two things of the shell, call::trim and apply::start::change_note. T3 moves them into the core or passes their answers in the snapshot. T12.1 adds dispatch/src/answer.rs to the files, which decide and the snapshot use; it uses nothing of the shell, so the count holds."

# R6: a supplier's failure reaches a caller as a named outcome, not a raw
# HTTP status the caller must read.

[[check]]
id = "raw-statuses"
rule = "R6"
what = "GitHub's HTTP statuses are read only in the forge"
pattern = 'HTTP [45][0-9]{2}|\b(status|code)\s*(==|!=)\s*[45][0-9]{2}\b|"(401|403|404|409|422|429|500|502|503)"'
files = ["console/**/*.rs"]
allowed = [
  # only Bounded and GhRunner, the runner the adapter takes from core until T4.11, and the reading of its reason; a GitHub call here must not hide behind this
  "console/core/src/forge.rs",
  # the GitHub adapter (T4.2), the one place GitHub's paths, gh and its statuses are written
  "console/github/**",
  # only the 404 of tehas's own docs server for /host; a GitHub status read here must not hide behind this
  "console/tests/host_bridge.rs",
]
comment = "//"
max = 208
why = "The map at T0: core 92 outside the forge (end_fault, journal, retry, call read gh's error text), dispatch 51, the console 46, ops 31, cycle 26, plugin 6, the rest 1 or 2. 55 are in test files. T4 turns them into the ports' named outcomes, read in the adapter. console/tests/host_bridge.rs is allowed: its one match is the docs server's own 404 for /host, which tehas serves, not GitHub's status. At its fork value (259). Each allowed test file is listed in `allowed` with a comment saying what it covers. T16's drop of the Spec mark takes out 3. T4.2 moves the forge's GitHub side into the adapter, console/github/ (tehas-github), and the allowed with it: console/github/** in place of console/core/src/forge/**. console/core/src/forge.rs stays allowed while Bounded and GhRunner are in it, until T4.11: its one status is the 404 of says_not_found, which reads the reason Bounded makes. The count is unchanged. T4.3 moves the test of `tehas resume`'s read onto the ports' fake, so its two gh failures, HTTP 502, go: 2 fewer. T4.5 (a): the cycle tests of a write GitHub answered with a 5xx assert it on the fake's faults: 6 fewer. T4.5 (b): the cycle tests of a park write GitHub answered with a 5xx assert it on the fake's faults: 6 fewer. B7b: the GitHub App's calls in ops (console/ops/src/github.rs) and the pins' fetch say a failed curl call as an outcome's line, not as `HTTP <status>`, and setup waits on an app GitHub does not know yet by the outcome, not by the text: 11 fewer. The status curl names is read as a number in console/ops/src/curl.rs, which this pattern does not see; it is a reader of statuses outside the adapter on today's path until T4.10 moves the App's calls into the adapter and the pins' GitHub reads onto CodeHost. B7a: `tehas start`, the preview's notice and `tehas init-product` say a failed gh call as an outcome's line, read by core's retry::outcome_of, in place of matching `HTTP <status>` in gh's text; their tests give gh's own error lines: 3 fewer. T4.11's plugin reads the code host's refusal of a status as Outcome::Forbidden, not as \"HTTP 403\", and its run tests inject failures through the ports' fake, and ops' status samples are said in our words: the rest of the fall. T4.7 2b: a refused label change is read in the site's words, not gh's HTTP 403: 1 fewer (2 out of the tests, 1 into the stub that answers the adapter)."

# R7: tests drive the ports' fakes, not gh's argument lists.

[[check]]
id = "tests-stub-gh"
rule = "R7"
what = "no shell test stubs gh where the point is not the bash; no Rust test outside the forge's pins a gh argument list"
pattern = 't_stub gh\b|"gh"|\bgh (api|pr|issue|repo|release|run|label|search)\b'
files = ["test/**/*.sh", "console/**/tests/**", "console/**/tests.rs", "console/**/*_tests.rs"]
allowed = [
  # the GitHub adapter's own tests, on its recordings (T4.2)
  "console/github/**",
]
comment = "#"
max = 310
why = "The map at T0: dispatch's tests 191, the shell tests of test/ 123 (84 of them t_stub gh), cycle 45, the console 31, store 17, core, mcp 4 each, ops 2, analytics, attach 1 each. T1 moves each crate's tests onto the ports' fakes, with the same answers, before its calls move; the forge's own pins stay. The test harnesses take the lists of tools every test stubs to fail from console/core/src/testing.rs, which is not in this check's files, in place of eight copies of the deny list and three lists of their own; that takes out 10 (5 of them from T15's ports, 5 older), console_run's calls(\"gh\") among them. Still counted from T15's ports: the short name \"gh\" of a process in a fixture of /proc in console/tests/top_snapshot.rs, a false positive kept as a written floor of 1 in docs/architecture.md. Below its fork value (419) by 18. T16's drop of the Spec mark takes out 2. T4.2 moves the forge's tests to the adapter's, console/github/tests/, and the allowed with them: console/github/** in place of console/core/src/forge/**. The count is unchanged. T15's port of test/state_test.sh takes out 1, its t_stub gh. T4.10 moves the cases of `tehas stop`'s running mark from test/stop_test.sh onto the ports' fake in console/ops/src/stop.rs; the stops that go on to it end to end keep one gh stub, which answers the issue's REST read: 3 fewer. T8 froze the shell tests that stay shell as a written floor of 83 in docs/architecture.md, \"The bash that stays\" (the owner, 2026-11-23), in 18 files of test/, the ones ports spec T4.12 and its Done keep: the tests of the two gh shims, of the container's argument lists (sandbox_argv_test.sh, rule 4), of lib/github-app.sh, of t_gh_fail in test/lib.sh, of install.sh, bootstrap.sh, init-product, setup, lib/config.sh and scripts/tag-release.sh. The other 27 matches in 21 files of test/ at 9a6e173df, update_test.sh among them, stub gh for a behaviour of Rust code: T4.12 moves them into Rust over the fake with the crate they test (T15 ports the shell tests), no floor. 36 matches are in data files of Rust tests, not bash and no part of T8's floor: dispatch's JSON fixtures 21 give way to builders at T4.6; the store's 1.x SQL fixtures 10, core's text samples 4 and mcp's log sample 1 are written floors of T4 (ports spec T4.4, T4.8, T4.11 and its Done). T4.5 (a): the cycle's end-to-end tests assert the report's writes on the ports' fake; the stub gh stays for the binary's reads and the park's question and comment until T4.5 (b), and one test each of the report, the handoff and the stop reads its writes by method alone: 28 fewer. T15 ports test/pause_test.sh, test/limit_test.sh, test/drain_test.sh and test/host_message_test.sh to Rust (#2817): their four t_stub gh go, and the Rust tests pin no gh argument list: 4 fewer. T15 ports the stops of test/stop_test.sh that go on to the issue (#2816) into console/tests/stop.rs, whose stub gh is a Rust test's: its t_stub gh goes, 1 fewer. T15 ports test/export_test.sh and test/history_test.sh to Rust (#2821): export and history reach no GitHub, so their two t_stub gh go, and the Rust tests pin no gh argument list: 2 fewer. T4.7 2a asserts the dispatcher's comments on the journal's typed rows, not on gh's words: 33 fewer. T4.7 2b asserts the poll's label changes on the journal's typed rows: 5 fewer."

# The ports' crate (T4.1): std and serde alone, no supplier, no effects, as
# docs/specs/2026-11-22-ports.md says in "The crate".

[[check]]
id = "ports-deps"
rule = "R8"
what = "console/ports/Cargo.toml holds its package keys and serde alone, on its one exact line: no other dependency, no dev or build dependency, no feature, no build script"
pattern = '^(?!\s*($|#|\[package\]\s*$|\[dependencies\]\s*$|(name|edition|publish)\s*=|serde = \{ version = "1", default-features = false, features = \["std", "derive"\] \}\s*$))'
files = ["console/ports/Cargo.toml"]
max = 0
why = "New at T4.1. tehas-ports is vendored by a consumer at the tag, so it takes std and serde alone: no serde_json, so no Value reaches a port (R4), no workspace crate, no feature to get wrong, no build script. The pattern counts every line of the manifest that is not blank, a comment, the [package] or [dependencies] header, the name, edition or publish key, or serde's one line exactly as the spec gives it: version 1, default features off, std and derive. Any other serde line counts: other features, default features on, another version, a table form. Tightened at T4.1a's review."

[[check]]
id = "ports-words"
rule = "R1"
what = "no supplier name, supplier path or query word, or label word in the ports' code, doc lines or manifest"
pattern = '(?i:github|gitlab|jira|bitbucket|\bgh\b|graphql)|repos/|\bapi\.|tehas:[a-z]|\bneeds-human-attention\b|"epic"'
files = ["console/ports/src/**", "console/ports/Cargo.toml"]
max = 0
why = "New at T4.1. The ports speak tehas's words alone; what each supplier does is the adapter's, and the strings of each word are the vendored host/labels.tsv and host/markers.tsv, read by no code of the crate. No comment prefix is set, so doc lines count too."

[[check]]
id = "ports-effects"
rule = "R3"
what = "the ports read no file, network, process, environment, clock or standard stream, print nothing, and keep no state per thread"
pattern = 'std::(fs|net|process|env|thread)\b|\b(fs|net|process|env|thread)::|\bstd::\{.*\b(fs|net|process|env|thread)\b|^\s*(fs|net|process|env|thread)\b\s*(,|\}|as\b|$)|\bstd\s+as\b|\b(stdin|stdout|stderr)\b|\b(e?print(ln)?|dbg)!|Command::new|SystemTime|Instant::now|\bthread_local!'
files = ["console/ports/src/**"]
comment = "//"
max = 0
why = "New at T4.1. The ports are data and pure functions; the fake that comes with them keeps a clock of its own. Tightened at T4.1a's review: besides a path through std or a module, the pattern counts a grouped or aliased import of an effect module (use std::{fs, ...}, use std::{env as e}, a module alone on a line of a group spread over lines, std itself aliased), the standard streams (stdin, stdout, stderr, through io:: or not) and the print macros (print!, println!, eprint!, eprintln!, dbg!). Tightened at T4.1d: thread_local! counts too, since state kept per thread is hidden global state that a nested or cross-thread call reads wrong; the fake keeps what it counts in its World."

# The events (T11.1): each name is written once, in the events module.

[[check]]
id = "event-names"
rule = "R1"
what = "a string literal that equals an event name is written only in the ports' events module; elsewhere code names Name::CycleEnded"
pattern = '"(cycle\.(started|parked|ended)|question\.asked|change\.(offered|merged)|ticket\.(acted|closed)|factory\.limit-changed)"'
files = ["console/**/*.rs"]
allowed = ["console/ports/src/events/**"]
max = 0
why = "New at T11.1, as docs/specs/2026-11-22-events.md says in \"Why it cannot drift\". A new name joins the pattern in the pull request that adds it. No comment prefix is set, so a name quoted in a comment counts too."

# R8: only a program's wiring names the GitHub adapter (T4.2), as
# docs/specs/2026-11-22-ports.md says in "Who depends on whom".

[[check]]
id = "adapter-link-rule"
rule = "R1"
what = "the GitHub adapter takes the link rule from console/attach, its one written place, and from no other crate"
pattern = '^\s*attach\s*='
files = ["console/github/Cargo.toml"]
comment = "#"
max = 1
why = "New at T4.8, a written floor in docs/architecture.md. The ports spec moved the link rule of GitHub's store into the adapter; the tehas lead ruled for the alpha (2026-11-24) that LINK_RULE stays in console/attach/src/link.rs, written once (attach's the_rule_is_written_once), and the adapter keeps its edge to attach for Blueprints::attachments and attachments_in. The cause: core (issue_feed's links), dispatch (text::links), items (store.rs: is_link, is_external, sends_token) and cycle (gives.rs: may_link) read the rule too, and none may name the adapter (adapter-wiring); moving those readers onto the ports is not in the plan. The count may only fall: a copy of the rule in the adapter, or a second edge, is a rise."

[[check]]
id = "adapter-wiring"
rule = "R8"
what = "only a program's wiring (its main.rs) names the GitHub adapter, tehas-github: no library module, test or other module of a program"
pattern = '\btehas_github\b'
files = ["console/**/*.rs"]
allowed = [
  "console/github/**",
  "console/src/main.rs",
  "console/*/src/main.rs",
]
comment = "//"
max = 0
why = "New at T4.2 at 3: console/src/commands.rs (the forge tehas resume read the control issue with), console/tests/resume_switch.rs (its test) and console/src/label.rs (console label allowed). T4.3 moves all three onto the tickets port: the console's wiring, a module of console/src/main.rs, makes the handle, commands.rs and label.rs take it from there, and the test runs on the ports' fake from console/ops/tests/. So the count is 0, and stays 0: a new caller of the adapter outside a main.rs is a rise."
