# The architecture test's checks for tehas. The rules R1 to R10 and the
# grading are in docs/architecture-rubric.md; scripts/architecture.py is
# the same in every repository of the tehas system and reads this file.
#
# Each max is today's count, a ratchet: a pull request may not raise it,
# or change what a check counts, without a new `why`, and the pull request
# that lowers a count lowers its max. A max above 0 always says why. The
# aim for each is 0, or a floor written in docs/architecture.md. The
# questions a reviewer answers are in docs/architecture-review.md.
#
# Tests are counted, in files of their own and in #[cfg(test)] modules
# alike, so a test that moves does not lower a count it did not fix.
# Only a port's own fake and an adapter's own tests are allowed.

version = 1
method = "docs/architecture-rubric.md"
review = "docs/architecture-review.md"

[[check]]
id = "github-rest"
rule = "R1"
what = "GitHub's REST paths, its GraphQL API and its API host are written only in the forge"
pattern = 'api\.github\.com|\bgraphql\b|\brepos/(\{|\$|:owner)|"/?(user|users|orgs|installation)/|/(issues|pulls|labels|check-runs|commits|git/refs|releases|collaborators|installations|actions)(/|\b)\{|--jq\b|"--json"|\b(headRefName|baseRefName|headRefOid|mergedAt|closedAt|createdAt|updatedAt|isDraft|statusCheckRollup|reviewDecision|mergeStateStatus|mergeable|timelineItems|labelEvents|pageInfo|endCursor|hasNextPage)\b'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*", "host/fun/**/*.js"]
allowed = ["console/core/src/forge.rs", "console/core/src/forge/**"]
comment = "//"
max = 840
why = "Re-measured at T0's follow-up, with tests in files counted and GitHub's JSON fields, --json and --jq added: the console 240, dispatch 225, ops 98, cycle 93, the front pages 69, mcp 38, store 37, core 21 outside the forge, analytics 8, xtask 6, the sandbox 4, the rest 1 or 2. 219 are in test files. Some field names (createdAt, updatedAt) are also tehas's own JSON keys where it copied GitHub's: T4 and T7 rename or own them. T4 moves the rest behind the three ports."

[[check]]
id = "gh-argv"
rule = "R2"
what = "the gh program is run only by the forge"
pattern = '"gh"|\bgh (api|pr|issue|repo|release|run|label|auth|search|workflow|secret|variable)\b'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*"]
allowed = ["console/core/src/forge.rs", "console/core/src/forge/**"]
comment = "//"
max = 408
why = "Re-measured at T0's follow-up, with tests in files counted: dispatch 207, cycle 67, the console 62, ops 34, core 13, store 11, mcp and xtask 4 each, the rest 1 or 2. 255 are in test files, which T1 moves onto the ports' fakes. The security shims that decide whether a gh call writes are among the rest: whether they stay separate is the owner's (T4), and those that stay become a written floor."

[[check]]
id = "label-words"
rule = "R1"
what = "the state labels and markers (tehas:...) are written only in the one module that names them"
pattern = 'tehas:[a-z]|\bneeds-human-attention\b|"epic"'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*", "host/fun/**/*.js"]
comment = "//"
max = 1878
why = "Re-measured at T0's follow-up, with tests in files counted and needs-human-attention and epic added: dispatch 1010, cycle 228, core 189, the console 184, ops 137, store 70, the front pages 34, mcp 21, analytics 4, plugin 1. 930 are in test files. T2 gives the state words one owner in core, checked against host/labels.tsv."

[[check]]
id = "home-layout"
rule = "R1"
what = "the $TEHAS_HOME layout (state/, live/, run/) is written only in Home"
pattern = '"(state|live|run)/|join\("(state|live|run)"\)|TEHAS_HOME}?/(state|live|run)\b|~/tehas/(state|live|run)\b|\{home\}/(state|live|run)\b|%h/tehas/(state|live|run)\b|/tehas/(state|live|run)/'
files = ["console/**/*.rs", "bin/*", "lib/*.sh", "libexec/*", "install.sh", "bootstrap.sh", "host/env.sh", "host/sandbox/build.sh", "host/sandbox/gh-shim", "scripts/**/*.sh", "host/systemd/*", "host/fun/**/*.js"]
allowed = ["console/core/src/home.rs"]
comment = "//"
max = 493
why = "T5 gives the layout one owner, Home (console/core/src/home.rs), which writes it and is allowed. The count is what is still written elsewhere, measured at T5's cycle step: dispatch 341, cycle 71, store 16, ops 14, the console 10, contractor 9, install.sh 21, core 5, the units 5, xtask 1. T5 has moved every crate onto Home but dispatch, which waits for its own slice. Floors: the bash and the units until T8, which asks Home; the shell stubs in the tests of cycle (65 of its 71), of contractor (its 9) and of the console (5 of its 10) until T8; the tests whose expected value is a path, an argument or a message naming one (3 more of cycle, 4 more of the console, 9 of the store, 9 of ops), which keep the literal so Home is not checked against itself; a file nothing writes any more, which cycle's tests check is not made (its last 3); a test's own scratch file (the console's last 1, one of the store), whose name is not one Home gives; the store's messages that name state/cycles (its other 6); xtask's run dir and the scratch dir of ops' update sandbox test (its other 5), which are not the home; and in core, the tests that pin a path's literal against Home and a container's own state dir."

[[check]]
id = "untyped-signatures"
rule = "R4"
what = "no serde_json::Value in a function's signature"
mode = "spans"
start = '^\s*(pub(\([^)]*\))?\s+)?(const\s+)?(async\s+)?(unsafe\s+)?fn\s'
end = '\{|;\s*$'
pattern = '\bValue\b'
files = ["console/**/*.rs"]
comment = "//"
max = 1400
why = "Re-measured at T0's follow-up, with tests in files counted: dispatch 366, mcp 251, cycle 181, the console 162, core 128, ops 89, store 77, analytics 45, attach 42, plugin 33, proxy 28, contractor 16. 377 are in test files. T3 types the dispatcher's core, T4 the ports, T5 the store client; T7 moves the rest or writes a floor for an adapter's own parsing."

[[check]]
id = "untyped-fields"
rule = "R4"
what = "no serde_json::Value in a public field, an enum variant or a tuple field"
pattern = '^\s*pub(\([^)]*\))?\s+[a-z_][a-z0-9_]*\s*:.*\bValue\b|^\s*[A-Z][A-Za-z0-9]*\s*\([^()]*\bValue\b[^()]*\),?\s*$|^\s*(pub(\([^)]*\))?\s+)?struct\s+\w+\s*(<[^>]*>)?\s*\(.*\bValue\b'
files = ["console/**/*.rs"]
comment = "//"
max = 40
why = "Re-measured at T0's follow-up, with enum variants and tuple fields added: dispatch 23 (Snapshot and its rows, after T3 typed the closing pull requests, the pause flag, the limit, the start order, the host's approvals, the branch check, the push fault, the lists of issues and pull requests and the parks owed a retry or a refine), cycle 7, ops 5, attach, contractor, core and the console 3 each, mcp, plugin, proxy and store 1 each. T3 types Snapshot; T7 the rest, or a written floor."

[[report]]
id = "public-items"
rule = "R5"
what = "public items per file, pub(crate) and pub use included: a rise is a question in review"
pattern = '^\s*pub(\([^)]*\))?\s+((async|const|unsafe)\s+)*(fn|struct|enum|trait|type|const|static|mod|use)\b'
files = ["console/**/*.rs"]
allowed = ["console/**/tests/**", "console/**/tests.rs", "console/**/*_tests.rs"]
comment = "//"
top = 20

# R3, R8: the core. Today it is the dispatcher's decide and the modules it
# reads: what it decides from (snapshot, settings, place, text, questions,
# starts). tehas-core
# is not pure (it holds the forge, the sandbox and the process runner), so
# it is not the core; T6 settles where the core ends and widens these.

[[check]]
id = "core-effects"
rule = "R3"
what = "the core reads no file, network, process, environment or clock"
pattern = 'std::(fs|net|process|env)\b|\bfs::|Command::new|SystemTime::now|Instant::now|Utc::now|Local::now|env::var|reqwest|tokio::(fs|net|process)|thread::sleep'
files = ["console/dispatch/src/decide.rs", "console/dispatch/src/decide/**", "console/dispatch/src/place.rs", "console/dispatch/src/snapshot.rs", "console/dispatch/src/text.rs", "console/dispatch/src/settings.rs", "console/dispatch/src/questions.rs", "console/dispatch/src/starts.rs", "console/dispatch/src/answer.rs"]
comment = "//"
max = 0
why = "The core's files, and since T12.1 the reading of an answer of tehas answer (dispatch/src/answer.rs), which decide and the snapshot use: it reads nothing either."

[[check]]
id = "core-inward"
rule = "R8"
what = "the core uses nothing of the shell or the adapters"
pattern = '\b(crate::(read|apply|poll|finish|auto_finish|refresh|pins|usage)|tehas_core::(forge|sandbox|call|retry|access|journal|lock|file|disk|install|tunnel|github_fails|release|rukas))\b'
files = ["console/dispatch/src/decide.rs", "console/dispatch/src/decide/**", "console/dispatch/src/place.rs", "console/dispatch/src/snapshot.rs", "console/dispatch/src/text.rs", "console/dispatch/src/settings.rs", "console/dispatch/src/questions.rs", "console/dispatch/src/starts.rs", "console/dispatch/src/answer.rs"]
comment = "//"
max = 1
why = "The map at T0 had three; T3 moved the push fault's hold into snapshot.rs. decide.rs reads two things of the shell, call::trim and apply::start::change_note. T3 moves them into the core or passes their answers in the snapshot. T12.1 adds dispatch/src/answer.rs to the files, which decide and the snapshot use; it uses nothing of the shell, so the count holds."

# R6: a supplier's failure reaches a caller as a named outcome, not a raw
# HTTP status the caller must read.

[[check]]
id = "raw-statuses"
rule = "R6"
what = "GitHub's HTTP statuses are read only in the forge"
pattern = 'HTTP [45][0-9]{2}|\b(status|code)\s*(==|!=)\s*[45][0-9]{2}\b|"(401|403|404|409|422|429|500|502|503)"'
files = ["console/**/*.rs"]
allowed = ["console/core/src/forge.rs", "console/core/src/forge/**"]
comment = "//"
max = 259
why = "The map at T0: core 92 outside the forge (end_fault, journal, retry, call read gh's error text), dispatch 51, the console 46, ops 31, cycle 26, plugin 6, the rest 1 or 2. 55 are in test files. T4 turns them into the ports' named outcomes, read in the adapter."

# R7: tests drive the ports' fakes, not gh's argument lists.

[[check]]
id = "tests-stub-gh"
rule = "R7"
what = "no shell test stubs gh where the point is not the bash; no Rust test outside the forge's pins a gh argument list"
pattern = 't_stub gh\b|"gh"|\bgh (api|pr|issue|repo|release|run|label|search)\b'
files = ["test/**/*.sh", "console/**/tests/**", "console/**/tests.rs", "console/**/*_tests.rs"]
allowed = ["console/core/src/forge/**"]
comment = "#"
max = 419
why = "The map at T0: dispatch's tests 191, the shell tests of test/ 123 (84 of them t_stub gh), cycle 45, the console 31, store 17, core, mcp 4 each, ops 2, analytics, attach 1 each. T1 moves each crate's tests onto the ports' fakes, with the same answers, before its calls move; the forge's own pins stay."
