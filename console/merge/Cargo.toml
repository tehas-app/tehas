# The easy merge: the first refresh of a conflicting pull request, a merge the
# rules settle and at most one bare `pi` session, pushed as one merge commit
# (#1031). Meant as the command the dispatcher's start runs. Not installed yet:
# no install.sh list or release names it, and no installed command starts it
# (NOT_INSTALLED in ../xtask/src/pack/tests.rs). A member of the workspace in
# ../Cargo.toml.
[package]
name = "tehas-merge"
version = "0.1.0"
edition = "2021"
# The oldest compiler that builds the workspace's members.
rust-version = "1.89"
publish = false

[lib]
name = "tehas_merge"
path = "src/lib.rs"

[[bin]]
name = "tehas-merge"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tehas-core = { path = "../core" }
