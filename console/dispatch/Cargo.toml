# The dispatcher's decisions: what one poll does, given what it read, and the
# reads of a snapshot. A member of the workspace in ../Cargo.toml. The binary,
# tehas-dispatch, is the poll: libexec/dispatch loads the settings and runs it.
[package]
name = "tehas-dispatch"
version = "0.1.0"
edition = "2021"
# File::try_lock, which the snapshot asks a lock with.
rust-version = "1.89"
publish = false

[lib]
name = "tehas_dispatch"
path = "src/lib.rs"

[[bin]]
name = "tehas-dispatch"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
sha2 = "0.10"
tehas-core = { path = "../core", features = ["mask"] }
