# The store program: install.sh builds it and installs the binary as
# ~/tehas/libexec/store. It is the only writer of state/tehas.db. A member of
# the workspace in ../Cargo.toml. The crates are the ones the analytics
# program already resolves: rusqlite with the bundled SQLite.
[package]
name = "store"
version = "0.1.0"
edition = "2021"
# The oldest compiler that knows what the source uses (File::try_lock).
rust-version = "1.89"
publish = false

# The verbs are a library as well, so the console calls the store in its own
# process (src/call.rs) rather than starting this program.
[lib]
name = "store"
path = "src/lib.rs"
# The comments are the program's manual, not examples to run.
doctest = false

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
tehas-core = { path = "../core", features = ["mask"] }

# rusqlite's `trace` feature is for the tests alone: it is the hook that lets
# `tests::a_read_open_runs_no_quick_check_and_a_write_open_still_does` ask
# whether an open ran `PRAGMA quick_check` (#1769). A feature of a dependency
# cannot be asked for by `[dev-dependencies]` alone when `[dependencies]` also
# names the crate, so it is named here; it adds no C and no code to the program,
# and Cargo would resolve it for any member of the workspace that asked.
