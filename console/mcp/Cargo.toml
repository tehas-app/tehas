# The read-only MCP server: install.sh builds it static (musl) and installs the
# binary as ~/tehas/libexec/tehas-mcp. A member of the workspace in ../Cargo.toml.
[package]
name = "tehas-mcp"
version = "0.1.0"
edition = "2021"
# The oldest compiler that knows what the source uses (Option::is_none_or).
rust-version = "1.82"
publish = false
# The one test target below is listed by hand and nothing else under tests/ is
# discovered: each of the nine suite files is a module of tests/main.rs, and
# autotests would also link every one of them as a test target of its own.
autotests = false

[lib]
name = "mcp"
path = "src/lib.rs"

[[bin]]
name = "tehas-mcp"
path = "src/main.rs"

# The nine suite files of tests/ are modules of this one rather than nine test
# targets, so they link one binary instead of nine that each carried their own
# copy of the harness and of this crate (#1116). A test keeps its own name, so
# the path of one is its module and its own: `logs::the_id_is_checked_...`.
[[test]]
name = "mcp"
path = "tests/main.rs"

[dependencies]
flate2 = "1"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tehas-core = { path = "../core", features = ["mask"] }
