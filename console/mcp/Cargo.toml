# The read-only MCP server: install.sh builds it static (musl) and installs the
# binary as ~/tehas/libexec/tehas-mcp. A member of the workspace in ../Cargo.toml.
[package]
name = "tehas-mcp"
version = "0.1.0"
edition = "2021"
# The oldest compiler that knows what the source uses (Option::is_none_or).
rust-version = "1.82"
publish = false

[lib]
name = "mcp"
path = "src/lib.rs"

[[bin]]
name = "tehas-mcp"
path = "src/main.rs"

[dependencies]
flate2 = "1"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tehas-core = { path = "../core", features = ["mask"] }
