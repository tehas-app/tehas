# The plugins' program (docs/specs/2026-11-21-plugins-security.md): the run
# of a plugin's container with its model socket, and the timer's tick. A
# member of the workspace in ../Cargo.toml.
[package]
name = "tehas-plugin"
version = "0.1.0"
edition = "2021"
# The day's total is kept under File::lock (1.89).
rust-version = "1.89"
publish = false

[lib]
name = "tehas_plugin"
path = "src/lib.rs"

[[bin]]
name = "tehas-plugin"
path = "src/main.rs"

[dependencies]
# The swap of a view into place, one rename that exchanges two directories.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
serde_json = "1"
tehas-core = { path = "../core" }
# The fetch's seam, the plugin's state and the store (ops/src/plugin).
tehas-ops = { path = "../ops" }

[dev-dependencies]
# The seam's fake answers for git and docker.
tehas-ops = { path = "../ops", features = ["testing"] }
