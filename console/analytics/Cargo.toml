# The analytics program: install.sh builds it and installs the binary as
# ~/tehas/libexec/analytics. A member of the workspace in ../Cargo.toml.
[package]
name = "analytics"
version = "0.1.0"
edition = "2021"
# The oldest compiler that builds it: tehas-core needs 1.89 (File::try_lock).
rust-version = "1.89"
publish = false

[[bin]]
name = "analytics"
path = "src/main.rs"

[dependencies]
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
tehas-core = { path = "../core", features = ["mask"] }
