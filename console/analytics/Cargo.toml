# The analytics program: install.sh builds it and installs the binary as
# ~/tehas/libexec/analytics. A member of the workspace in ../Cargo.toml.
[package]
name = "analytics"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "analytics"
path = "src/main.rs"

[dependencies]
# For the console's mask, which this program shares (src/main.rs).
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
