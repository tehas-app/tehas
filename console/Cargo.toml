# The console of a running cycle: tehas work starts it, install.sh builds
# it and installs the binary as ~/tehas/libexec/console. It is also the root
# of the workspace, so the gate's cargo commands on this manifest cover the
# analytics program in analytics/, the store in store/, the MCP server in
# mcp/, the attachment checker in attach/, the library they share in core/,
# the dispatcher's decisions in dispatch/, a cycle's report in cycle/, the
# operations modules in ops/, the model proxy of outsource in proxy/, the
# contractor program of outsource in contractor/, the plugins' program in
# plugin/ and the development tasks behind scripts/ in xtask/ as well.
[workspace]
members = ["analytics", "attach", "contractor", "core", "cycle", "dispatch", "front", "mcp", "ops", "plugin", "proxy", "store", "xtask"]
default-members = [".", "analytics", "attach", "contractor", "core", "cycle", "dispatch", "front", "mcp", "ops", "plugin", "proxy", "store", "xtask"]

[package]
name = "console"
version = "0.1.0"
edition = "2021"
# The oldest compiler that builds the default members: the store needs 1.89
# (File::try_lock). The console's own source needs 1.80 (LazyLock).
rust-version = "1.89"
publish = false

[dependencies]
# The link rule, the fetch and the manifest (src/attach.rs, src/protolab).
attach = { path = "attach" }
libc = "0.2"
# The wiki's Markdown, rendered on the host with any HTML in it shown as text
# (src/wiki/render.rs).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
rustix = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
# The state store, called in this process (ops/src/store.rs).
store = { path = "store" }
tehas-core = { path = "core", features = ["mask"] }
tehas-cycle = { path = "cycle" }
# The operations modules (ops/src), which main.rs takes by one use line.
tehas-ops = { path = "ops" }

[dev-dependencies]
# The store's test hook, which the history tests plant answers in.
tehas-ops = { path = "ops", features = ["testing"] }
# The dispatcher's read of a refresh request, which a test holds to the console's.
tehas-dispatch = { path = "dispatch" }

# Line tables only, and no incremental data: a build of the workspace in the
# dev and test profiles is about a third the size. Backtraces keep file and
# line, which is why debug is not 0. The worst rebuild costs a few seconds,
# the cold build saves more than that.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
strip = true
