# The console of a running cycle: libexec/work starts it, install.sh builds
# it and installs the binary as ~/tehas/libexec/console.
[package]
name = "console"
version = "0.1.0"
edition = "2021"
# The oldest compiler that knows what the source uses (LazyLock).
rust-version = "1.80"
publish = false

[dependencies]
libc = "0.2"
regex = "1"
serde_json = "1"
signal-hook = "0.3"

[profile.release]
strip = true
