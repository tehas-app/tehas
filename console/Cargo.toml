# The console of a running cycle: libexec/work starts it, install.sh builds
# it and installs the binary as ~/tehas/libexec/console. It is also the root
# of the workspace, so the gate's cargo commands on this manifest cover the
# analytics program in analytics/, the store in store/, the MCP server in
# mcp/, the attachment checker in attach/, the library they share in core/,
# the dispatcher's decisions in dispatch/, a cycle's report in cycle/ and the
# easy merge of a pull request in merge/ as well.
[workspace]
members = ["analytics", "attach", "core", "cycle", "dispatch", "mcp", "merge", "store"]
default-members = [".", "analytics", "attach", "core", "cycle", "dispatch", "mcp", "merge", "store"]

[package]
name = "console"
version = "0.1.0"
edition = "2021"
# The oldest compiler that builds the default members: the store needs 1.89
# (File::try_lock). The console's own source needs 1.80 (LazyLock).
rust-version = "1.89"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"
tehas-core = { path = "core", features = ["mask"] }

# Line tables only, and no incremental data: a build of the workspace in the
# dev and test profiles is about a third the size. Backtraces keep file and
# line, which is why debug is not 0. The worst rebuild costs a few seconds,
# the cold build saves more than that.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
strip = true
