# A cycle's supervisor: what tehasbot cycle and tehas work do, in Rust (#256).
# A member of the workspace in ../Cargo.toml. So far the binary, tehas-cycle,
# starts a cycle from its own copy of the code, and decides a cycle's report
# from what the cycle left. It applies the report where the instance asks for
# that; libexec/cycle reports by default.
[package]
name = "tehas-cycle"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "tehas_cycle"
path = "src/lib.rs"

[[bin]]
name = "tehas-cycle"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tehas-core = { path = "../core", features = ["mask"] }
