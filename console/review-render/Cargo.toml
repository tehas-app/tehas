# The review's renderer: the findings of one lens review rendered into an
# issue's title and body. Nothing in core calls it since the review loop left
# core in 2.0; the review plugin of 2.1 vendors it. A library member of the
# workspace in ../Cargo.toml.
[package]
name = "tehas-review-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "tehas_review_render"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
