# The Kani proofs: every #[kani::proof] in the crates listed below, on pull
# requests into main and on pushes to main, and by hand on any branch. They do
# not run in scripts/verify.sh: Kani installs from the network and builds with
# its own pinned nightly, and the gate runs without either. A crate that gains
# a #[cfg(kani)] module joins the list; test/kani_workflow_test.sh checks it.
# It reads only the repository and reaches the network for Kani, at the
# version pinned here, and its toolchain.
name: kani
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kani-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  proofs:
    # A hosted runner: Kani and CBMC are large, and nothing of ours is needed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KANI_VERSION: 0.68.0
      KANI_CRATES: tehas-core attach tehas-dispatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kani at the pinned version
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
          cargo kani --version
      - name: the proofs
        working-directory: console
        run: |
          # cargo kani takes no --locked; the build still reads Cargo.lock.
          args=()
          for crate in $KANI_CRATES; do args+=(-p "$crate"); done
          cargo kani "${args[@]}"
