# The release of a tag: check the tag is a commit on main pushed by an admin,
# build the programs, pack the tarball, sign it, check the signature, and
# publish it as the tag's GitHub Release.
# Written by a person, not a work cycle: CI files are protected. The interface
# it calls is scripts/pack-release.sh and scripts/release-notes.sh, both in the
# gate; this file is not.
#
# A prerelease tag, vX.Y.Z-alpha.N, -beta.N or -rc.N, is built, signed and
# published the same way, marked as a GitHub prerelease and never as the
# latest release: tehas update installs one only when it is named.
#
# Assets of a release vX.Y.Z:
#   tehas-vX.Y.Z-linux-x86_64.tar.gz           the tarball
#   tehas-vX.Y.Z-linux-x86_64.tar.gz.sha256    its hash, for sha256sum -c
#   tehas-vX.Y.Z-linux-x86_64.tar.gz.minisig   its signature
#   install, install.minisig                   the installer, when the tag
#                                              has host/release/install
#
# Secrets, in the environment `release` and nowhere else: MINISIGN_SECRET_KEY,
# the whole secret key file; MINISIGN_PASSWORD, its password, only when the key
# has one. The environment takes only tags and waits for a reviewer, so a tag
# is signed only after a person approves its run.
name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    # A clean GitHub-hosted runner, gone after the job: not the runners pull
    # requests run on. The job installs its own minisign, jq and Rust at
    # pinned versions; the image gives bash, git, curl, tar, gcc for the
    # bundled SQLite, and the jq of the first step, which runs before anything
    # of the tagged tree is read.
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so origin/main is here for the next step.
          fetch-depth: 0
      # First, before any step runs code of the tagged tree.
      - name: the tag is a commit on main, pushed by an admin of the repository
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "$TAG is not on main: $(git rev-parse HEAD)" >&2
            exit 1
          }
          case $ACTOR in '' | *'[bot]') echo "$TAG was pushed by '$ACTOR', not by a person" >&2; exit 1 ;; esac
          role=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/collaborators/$ACTOR/permission" | jq -r .permission) || role=
          [ "$role" = admin ] || { echo "$TAG was pushed by $ACTOR, who is not an admin of $REPO" >&2; exit 1; }
      - name: the runner builds for linux x86_64
        run: |
          [ "$(uname -s) $(uname -m)" = "Linux x86_64" ] || { echo "not a linux x86_64 runner: $(uname -sm)" >&2; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          # The runner context is not available in the job's env, so DIST is set here.
          echo "DIST=$RUNNER_TEMP/dist" >>"$GITHUB_ENV"
      - name: minisign at a pinned version
        run: |
          # 0.12, checked against its author's signature when it was pinned.
          curl -fsSL -o "$RUNNER_TEMP/minisign.tar.gz" \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign 2>/dev/null
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"
      - name: jq at the pinned version
        run: |
          . host/versions.env
          mkdir -p "$RUNNER_TEMP/jq"
          curl -fsSL -o "$RUNNER_TEMP/jq/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64"
          echo "$JQ_SHA256  $RUNNER_TEMP/jq/jq" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/jq/jq"
          echo "$RUNNER_TEMP/jq" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/jq/jq" --version)" = "jq-$JQ_VERSION"
      - name: rust at the pinned version
        run: |
          # rustup at its pinned version and hash, in homes of the job's own,
          # so the image's toolchain is not the one that builds.
          . host/versions.env
          export RUSTUP_HOME=$RUNNER_TEMP/rustup CARGO_HOME=$RUNNER_TEMP/cargo
          curl -fsSL -o "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_VERSION" --target x86_64-unknown-linux-musl
          { echo "RUSTUP_HOME=$RUSTUP_HOME"; echo "CARGO_HOME=$CARGO_HOME"; } >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          version=$("$CARGO_HOME/bin/cargo" --version)
          [[ $version == "cargo $RUST_VERSION "* ]] || { echo "not cargo $RUST_VERSION: $version" >&2; exit 1; }
          # scripts/pack-release.sh builds its task offline.
          "$CARGO_HOME/bin/cargo" fetch --locked --manifest-path console/Cargo.toml
      - name: build the programs
        run: |
          . host/versions.env
          cargo --version
          # A release is never a lab build (console/core/src/features.rs), nor
          # built with debug assertions, whatever the runner's environment says.
          unset TEHAS_LAB_BUILD CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS
          # The MCP server is static, as install.sh builds it.
          rustup target add x86_64-unknown-linux-musl
          target=$RUNNER_TEMP/target
          cargo build --release --locked --manifest-path console/Cargo.toml --target-dir "$target" -p console -p analytics -p store -p attach -p tehas-dispatch -p tehas-cycle \
            -p tehas-proxy -p tehas-contractor
          cargo build --release --locked --manifest-path console/Cargo.toml --target-dir "$target" \
            --target x86_64-unknown-linux-musl -p tehas-mcp
          mkdir -p "$RUNNER_TEMP/programs"
          cp "$target/release/console" "$target/release/analytics" "$target/release/store" "$target/release/attach" "$target/release/tehas-dispatch" "$target/release/tehas-cycle" \
            "$target/release/tehas-proxy" "$target/release/tehas-contractor" \
            "$target/x86_64-unknown-linux-musl/release/tehas-mcp" "$RUNNER_TEMP/programs/"
          # An ELF for x86_64 (e_machine 0x3e), whatever the runner's defaults.
          for p in "$RUNNER_TEMP"/programs/*; do
            [ "$(od -An -tx1 -j18 -N2 "$p" | tr -d ' ')" = 3e00 ] || { echo "$p is not an x86_64 program" >&2; exit 1; }
          done
      - name: pack
        run: |
          # No pi-rukas pin: a release follows the line its versions.env names.
          p=$RUNNER_TEMP/programs
          TEHAS_PACK_ROOT=$PWD scripts/pack-release.sh "$TAG" "$DIST" --console "$p/console" \
            --analytics "$p/analytics" --mcp "$p/tehas-mcp" --store "$p/store" --attach "$p/attach" --dispatch "$p/tehas-dispatch" --cycle "$p/tehas-cycle" \
            --proxy "$p/tehas-proxy" --contractor "$p/tehas-contractor" \
            --commit "$(git rev-parse HEAD)"
          (cd "$DIST" && sha256sum -c "tehas-$TAG-linux-x86_64.tar.gz.sha256")
          if [ -f host/release/install ]; then cp host/release/install "$DIST/install"; fi
      - name: sign, and check the signature with the key in the tree
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "the secret MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          umask 077
          key=$(mktemp "$RUNNER_TEMP/key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          for f in "$DIST/tehas-$TAG-linux-x86_64.tar.gz" "$DIST/install"; do
            [ -f "$f" ] || continue
            # A key with a password reads it from standard input; one without
            # reads nothing.
            printf '%s\n' "$MINISIGN_PASSWORD" |
              minisign -S -s "$key" -m "$f" -t "tehas $TAG $(basename "$f")" >/dev/null
            minisign -V -q -p host/release/minisign.pub -m "$f"
          done
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(scripts/release-notes.sh "$TAG" 2>/dev/null || scripts/release-notes.sh Unreleased) || {
            echo "CHANGELOG.md of $TAG has no section for it" >&2
            exit 1
          }
          api=https://api.github.com/repos/$REPO
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          pre=false latest=true
          if [[ $TAG == *-* ]]; then pre=true latest=false; fi
          body=$(jq -n --arg tag "$TAG" --arg notes "$notes" --argjson pre "$pre" \
            '{tag_name: $tag, name: $tag, body: $notes, draft: true, prerelease: $pre}')
          # Made a draft and published only once every asset is on it, so no
          # one downloads a release that is missing its signature.
          release=$(curl -fsS "${auth[@]}" -X POST "$api/releases" -d "$body") || {
            echo "cannot create the release $TAG; is there one already?" >&2
            exit 1
          }
          id=$(jq -r .id <<<"$release")
          for f in "$DIST"/*; do
            curl -fsS "${auth[@]}" -H "Content-Type: application/octet-stream" --data-binary "@$f" \
              "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          curl -fsS "${auth[@]}" -X PATCH "$api/releases/$id" -d "{\"draft\": false, \"make_latest\": \"$latest\"}" |
            jq -r .html_url
