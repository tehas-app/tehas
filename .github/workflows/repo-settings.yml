# The check of the repository's own protection: scripts/check-repo-settings.py
# reads the branch rules back from the code host and fails when one is off,
# so a rule lost reads as a failed build and not as silence (the plugin spec
# 2.0.0 part 9, the gate files; tehas-standard v3 §11). It runs on every pull
# request, on main, and daily: the schedule catches a rule turned off between
# pull requests. The one secret it uses is the run's own read-only token, and
# it reads the repository and the code host's settings of it, nothing else.
# Written by a person, not a work cycle: CI files are protected.
name: repo-settings
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-settings-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  repo-settings:
    # It reads the code host's settings and the tree, and builds nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the script's own tests
        run: python3 -I -m unittest discover -s scripts -p 'check_repo_settings_test.py'
      - name: the repository's rules, read back
        run: python3 -I scripts/check-repo-settings.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
