# The gate, run on every pull request and on main: the lint, shellcheck, the
# shell tests and the console's tests. It makes scripts/verify.sh something a
# ruleset can require, and the check of the repository's lockfiles against
# published advisories. It reads only the repository. It reaches the network for
# the tools it downloads at the pinned versions of host/versions.env, and for
# the advisory scan, which sends the name and version of each package of those
# lockfiles to the OSV database and nothing else. The one secret it may use
# is GENERIC_NAMES, the private list of names for scripts/check-generic.sh,
# and only the names job sees it; a run without it says so. A pull request
# from a fork does not run these jobs at all.
name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a pull request cancels the run it supersedes. Runs on main are
# never cancelled, so every commit on main gets a result.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    # tehas-runner, the organization's own runner: it holds cargo (the
    # RUST_VERSION of host/versions.env), bash, git, jq and Docker, and gives
    # the job no sudo. A passing run took 7 to 15 minutes on a hosted runner.
    # A pull request from a fork does not run here: the repository is public,
    # and the runner is a machine of ours.
    # A batch pull request whose title starts with "Express Lane" runs on the
    # speed lane, [self-hosted, speedlane], the reserved runner the release
    # gate uses (host/docs/operating.md, The speed lane). The title, not a
    # label: the backlog run's merge train adds no labels.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ startsWith(github.event.pull_request.title, 'Express Lane') && fromJSON('["self-hosted", "speedlane"]') || fromJSON('["self-hosted", "tehas"]') }}
    timeout-minutes: 30
    # The runners keep their checkout between jobs, and a pull request's code
    # runs on them: a pass kept there by one run is not trusted by another.
    env:
      TEHAS_VERIFY_FRESH: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the lockfiles against published advisories
        run: |
          # OSV-Scanner at the pinned version, checked against the checksum its
          # own release publishes, then every lockfile of this repository
          # against the OSV database. A known advisory fails the job. No
          # dependency tree is sent to a package registry: each package name and
          # version is queried against the advisory database, and an advisory
          # carried on purpose is named in osv-scanner.toml with its reason and
          # the date to look again.
          . host/versions.env
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/osv-scanner"
          test "$("$RUNNER_TEMP/osv-scanner" --version | head -n 1)" = "osv-scanner version: $OSV_SCANNER_VERSION"
          # Bounded: a scan that cannot reach the database says so in its own
          # step rather than holding the job to its timeout.
          timeout 300 "$RUNNER_TEMP/osv-scanner" scan source \
            --config osv-scanner.toml --x-plugins lockfile --no-resolve \
            -L console/Cargo.lock \
            -L host/npm/pi/package-lock.json \
            -L host/npm/ctx7/package-lock.json \
            -L host/npm/parallel-web-cli/package-lock.json \
            -L host/sandbox/npm/playwright/package-lock.json
      - name: shellcheck at the pinned version
        run: |
          . host/versions.env
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          # On the job's PATH, not in /usr/local/bin: the runner gives no sudo.
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION/shellcheck" --version
      - name: jq at the pinned version
        run: |
          # The jq the host and a cycle's sandbox image run: a test whose jq
          # program parses only in a newer jq fails here too.
          . host/versions.env
          mkdir -p "$RUNNER_TEMP/jq"
          curl -fsSL -o "$RUNNER_TEMP/jq/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64"
          echo "$JQ_SHA256  $RUNNER_TEMP/jq/jq" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/jq/jq"
          echo "$RUNNER_TEMP/jq" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/jq/jq" --version)" = "jq-$JQ_VERSION"
      - name: node at the pinned version
        run: |
          # The node the host runs. Without node on the PATH the gate prints a
          # "skip" line for the front page's tests and runs none of them.
          . host/versions.env
          rm -rf "$RUNNER_TEMP/node"
          mkdir -p "$RUNNER_TEMP/node"
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/node/bin/node" --version)" = "v$NODE_VERSION"
      - name: the cargo build kept between runs
        run: |
          # The checkout's git clean removes console/target, so it lives outside
          # the workspace: one per runner instance, so two jobs never wait on
          # each other's cargo lock.
          dir=$HOME/.cache/tehas-target/$RUNNER_NAME
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: scripts/verify.sh
        run: scripts/verify.sh
  names:
    # The private list of names, on a hosted runner that is gone after the job.
    # It is never written on our runners, which run a pull request's code. On a
    # pull request the lint is the base branch's, so no code of the pull
    # request runs while the list is here: the files are read as data.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the lint of the base branch
        if: github.event_name == 'pull_request'
        run: |
          rm -f scripts/check-generic.sh
          git show "origin/$GITHUB_BASE_REF:scripts/check-generic.sh" > scripts/check-generic.sh
      - name: names in the files, the commit messages and the branch
        env:
          GENERIC_NAMES: ${{ secrets.GENERIC_NAMES }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$GENERIC_NAMES" ]; then
            echo "no GENERIC_NAMES secret: names not checked"
            exit 0
          fi
          # Written to a plain file in a plain directory, never through a link.
          [ -d scripts ] && [ ! -L scripts ] || { echo "scripts is not a directory" >&2; exit 1; }
          rm -f scripts/check-generic.names
          printf '%s\n' "$GENERIC_NAMES" > scripts/check-generic.names
          args=(--names-only)
          [ "$EVENT" != pull_request ] || args+=(--messages "origin/$GITHUB_BASE_REF..HEAD")
          bash scripts/check-generic.sh "${args[@]}"
